<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5">
<title>Fikrat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c96442'/%3E%3Ccircle cx='29' cy='29' r='13' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M39 39l10 10' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root, :root[data-theme="light"] {
    --bg: #faf9f5; --side: #f3f1ea; --panel: #ffffff; --raise: #ebe8de; --hover: #ebe8df;
    --ink: #1f1e1d; --dim: #5f5d57; --faint: #97948b; --line: #e3dfd3;
    --accent: #c96442; --accent-hi: #b3563a; --user: #efebe1; --code: #f4f2ec; --danger: #c0392b;
    --shadow: 0 1px 2px rgba(31,30,29,.04), 0 6px 20px rgba(31,30,29,.07);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #262624; --side: #1f1e1d; --panel: #30302e; --raise: #3b3a37; --hover: #363532;
    --ink: #f3f1ea; --dim: #bdbab0; --faint: #8a877e; --line: #44423e;
    --accent: #d97757; --accent-hi: #e48b6d; --user: #3b3a37; --code: #1d1c1b; --danger: #ef7d6d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; border-radius: 10px; padding: 8px 12px; display: inline-flex; align-items: center; gap: 8px; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=password], input[type=text], textarea.field { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  input:focus, textarea.field:focus { outline: none; border-color: var(--accent); }
  .serif { font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif; font-weight: 500; letter-spacing: -.01em; }
  .accent-btn { background: var(--accent); color: #fff; font-weight: 600; justify-content: center; }
  .accent-btn:hover:not(:disabled) { background: var(--accent-hi); }
  .soft-btn { border: 1px solid var(--line); background: var(--panel); }
  .soft-btn:hover { background: var(--hover); }
  .icon { padding: 8px; color: var(--dim); }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .muted { color: var(--dim); }
  .small { font-size: 13.5px; }

  /* ---------- sign in ---------- */
  #gate { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .card h1 { font-size: 34px; margin: 18px 0 6px; }
  .card p { margin: 0 0 24px; }
  .card input { margin-bottom: 10px; font-size: 16px; }
  .card .accent-btn { width: 100%; padding: 13px; border-radius: 12px; margin-top: 6px; font-size: 16px; }
  .err { color: var(--danger); font-size: 14px; min-height: 1.4em; margin: 2px 0 6px; }
  .mark { width: 52px; height: 52px; border-radius: 15px; background: var(--accent); display: inline-grid; place-items: center; }
  .mark svg { stroke: #fff; stroke-width: 2.4; width: 26px; height: 26px; }

  /* ---------- layout ---------- */
  #app { display: flex; height: 100dvh; overflow: hidden; }
  #side { width: 272px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 10px; transition: margin-left .2s; }
  #app.noside #side { margin-left: -272px; }
  .sidetop { display: flex; align-items: center; gap: 8px; padding: 2px 2px 10px 6px; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 19px; flex: 1; }
  .brand .mark { width: 26px; height: 26px; border-radius: 8px; }
  .brand .mark svg { width: 15px; height: 15px; stroke-width: 2.8; }
  #newchat { width: 100%; justify-content: flex-start; font-weight: 550; padding: 9px 10px; }
  #newchat .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
  #newchat .plus svg { width: 15px; height: 15px; stroke-width: 2.6; }
  #newchat:hover { background: var(--hover); }
  .label { font-size: 12.5px; font-weight: 600; color: var(--faint); padding: 16px 10px 6px; }
  #search { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 10px; font-size: 14px; margin-bottom: 6px; }
  #list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .chat { display: flex; align-items: center; border-radius: 10px; }
  .chat:hover, .chat.on { background: var(--hover); }
  .chat.on { background: var(--raise); }
  .chat span { flex: 1; min-width: 0; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14.5px; cursor: pointer; }
  .chat button { padding: 5px; color: var(--faint); opacity: 0; }
  .chat button:hover { color: var(--ink); }
  .chat:hover button, .chat.on button { opacity: 1; }
  .chat button svg { width: 15px; height: 15px; }
  .chat input { margin: 3px; padding: 5px 8px; font-size: 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--panel); width: 100%; }
  .empty-list { color: var(--faint); font-size: 14px; padding: 6px 10px; }
  #settingsbtn { width: 100%; justify-content: flex-start; color: var(--dim); padding: 10px; margin-top: 6px; }
  #settingsbtn:hover { background: var(--hover); color: var(--ink); }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #top { display: flex; align-items: center; gap: 4px; padding: 8px 10px; min-height: 52px; }
  #top .title { flex: 1; min-width: 0; text-align: center; font-size: 14.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  #scroller { flex: 1; overflow-y: auto; }

  /* empty state: greeting with the composer in the middle, like Claude */
  #hero { min-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px 16px 14vh; }
  #hero h1 { display: flex; align-items: center; gap: 14px; font-size: clamp(30px, 5vw, 40px); margin: 0 0 6px; text-align: center; }
  #hero h1 .mark { width: 40px; height: 40px; border-radius: 12px; }
  #hero h1 .mark svg { width: 21px; height: 21px; }
  #herosub { margin: 0 0 26px; text-align: center; }
  #heroslot { width: 100%; max-width: 720px; }
  #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  #chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: 14px; color: var(--dim); }
  #chips button:hover { color: var(--ink); border-color: var(--faint); }
  .banner { display: flex; align-items: center; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; color: var(--danger); font-size: 14.5px; }

  #thread { max-width: 760px; margin: 0 auto; padding: 8px 20px 28px; }
  .msg { margin-bottom: 26px; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble { background: var(--user); border-radius: 18px; padding: 10px 16px; max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .files { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 6px; }
  .files img { max-width: 200px; max-height: 200px; border-radius: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--raise); border-radius: 10px; padding: 5px 10px; font-size: 13px; }
  .actions { display: flex; gap: 2px; margin-top: 6px; min-height: 30px; }
  .actions button { padding: 6px; color: var(--faint); border-radius: 8px; }
  .actions button:hover { background: var(--hover); color: var(--ink); }
  .actions svg { width: 16px; height: 16px; }
  .msg.user .actions { opacity: 0; }
  .msg.user:hover .actions { opacity: 1; }
  .dots { display: inline-flex; gap: 5px; padding: 10px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  .errbox { border: 1px solid var(--danger); color: var(--danger); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; margin-top: 8px; }

  .md { font-size: 16.5px; line-height: 1.72; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md table, .md blockquote { margin: 0 0 14px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 22px 0 8px; line-height: 1.3; font-family: ui-serif, Georgia, serif; font-weight: 600; }
  .md h1 { font-size: 1.4em; } .md h2 { font-size: 1.25em; } .md h3 { font-size: 1.1em; }
  .md ul, .md ol { padding-left: 24px; } .md li { margin: 4px 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--dim); }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  .md th { background: var(--raise); }
  .md :not(pre) > code { background: var(--raise); padding: 2px 6px; border-radius: 6px; font-size: .88em; }
  code, pre { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .codeblock { border-radius: 12px; overflow: hidden; margin: 0 0 14px; background: var(--code); border: 1px solid var(--line); }
  .codeblock .bar { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px 3px 14px; font-size: 12px; color: var(--dim); background: var(--raise); }
  .codeblock .bar button { font-size: 12px; padding: 4px 8px; color: var(--dim); }
  .codeblock .bar svg { width: 14px; height: 14px; }
  .codeblock pre { margin: 0; padding: 14px; overflow-x: auto; font-size: 13.5px; line-height: 1.5; }

  /* videos an answer came from */
  .vids-label { font-size: 13px; color: var(--faint); margin: 16px 0 8px; }
  .vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .vid { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; overflow: hidden; color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s; }
  a.vid:hover { border-color: var(--accent); transform: translateY(-1px); }
  .vid .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--raise); display: grid; place-items: center; color: var(--faint); }
  .vid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vid .play { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; }
  .vid .play svg { width: 14px; height: 14px; fill: #fff; stroke: none; margin-left: 2px; }
  .vid span { padding: 8px 10px 9px; font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- composer ---------- */
  #dock { padding: 0 16px 10px; }
  #dock #composer { max-width: 760px; margin: 0 auto; }
  #composer { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 12px 12px 10px 16px; transition: border-color .15s; }
  #composer:focus-within { border-color: var(--faint); }
  #input { width: 100%; border: 0; background: none; resize: none; padding: 4px 2px 8px; max-height: 40vh; display: block; font-size: 16.5px; line-height: 1.5; }
  #input:focus-visible { outline: none; }
  #composer .row { display: flex; align-items: center; gap: 6px; }
  #atts { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 6px; }
  #atts:empty { display: none; }
  #atts img { width: 32px; height: 32px; object-fit: cover; border-radius: 8px; }
  .round { width: 34px; height: 34px; padding: 0; justify-content: center; border-radius: 10px; }
  #plus { border: 1px solid var(--line); color: var(--dim); }
  #plus:hover { background: var(--hover); color: var(--ink); }
  #modebtn { font-size: 14px; color: var(--dim); padding: 6px 10px; gap: 4px; }
  #modebtn:hover { background: var(--hover); color: var(--ink); }
  #modebtn svg { width: 15px; height: 15px; }
  #webpill { font-size: 13px; color: var(--accent); padding: 5px 9px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
  #send, #stop { background: var(--accent); color: #fff; }
  #send:hover:not(:disabled) { background: var(--accent-hi); }
  #send svg { stroke-width: 2.4; width: 18px; height: 18px; }
  #stop svg { fill: currentColor; stroke: none; width: 14px; height: 14px; }
  .fine { text-align: center; font-size: 12.5px; color: var(--faint); margin: 8px 0 0; }

  .menu { position: absolute; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; min-width: 260px; }
  .menu button { width: 100%; justify-content: flex-start; text-align: left; padding: 9px 10px; border-radius: 9px; align-items: flex-start; }
  .menu button:hover { background: var(--hover); }
  .menu button svg { margin-top: 2px; color: var(--dim); }
  .menu b { display: block; font-weight: 550; font-size: 14.5px; }
  .menu small { display: block; color: var(--faint); font-size: 12.5px; line-height: 1.35; }
  .menu .check { margin-left: auto; color: var(--accent); }
  #plusmenu { left: 10px; bottom: 54px; }
  #modemenu { right: 52px; bottom: 54px; }
  #heroslot .menu { top: calc(100% + 6px); bottom: auto; }
  #thread:empty { display: none; }

  /* ---------- settings ---------- */
  dialog { width: min(560px, calc(100vw - 24px)); max-height: min(720px, calc(100dvh - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--bg); color: var(--ink); box-shadow: var(--shadow); }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dhead { display: flex; align-items: center; padding: 16px 14px 10px 22px; }
  .dhead h3 { margin: 0; flex: 1; font-size: 22px; }
  .dbody { overflow-y: auto; padding: 4px 22px 22px; }
  .sect { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
  .sect h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; }
  .sect label { display: block; font-size: 14px; color: var(--dim); margin: 10px 0 6px; }
  .sect textarea.field { min-height: 120px; resize: vertical; font-size: 14px; }
  .sect input[type=text] { font-size: 14px; padding: 9px 12px; }
  .kv { font-size: 14px; color: var(--dim); line-height: 1.7; }
  .kv b { color: var(--ink); font-weight: 550; }
  .folder { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
  .folder:first-child { border-top: 0; }
  .folder span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: inline-flex; background: var(--raise); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { padding: 6px 14px; font-size: 14px; border-radius: 8px; color: var(--dim); }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btnrow button { font-size: 14px; padding: 8px 14px; }

  #toast { position: fixed; inset: auto auto 24px 50%; margin: 0; border: 0; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14.5px; }
  #scrim { display: none; }
  #app:not(.noside) #showside, #app:not(.noside) #newchat2 { visibility: hidden; }

  .mobile-only { display: none; }
  @media (max-width: 800px) {
    .mobile-only { display: inline-flex; }
    #app:not(.noside) #showside, #app:not(.noside) #newchat2 { visibility: visible; }
    #side { position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(300px, 86vw); transform: translateX(-100%); transition: transform .2s; margin: 0 !important; box-shadow: var(--shadow); }
    #app.open #side { transform: none; }
    #app.open #scrim { display: block; position: fixed; inset: 0; z-index: 39; background: rgba(0,0,0,.4); }
    .chat button, .msg.user .actions { opacity: 1; }
    #dock { padding: 0 10px 8px; }
    #thread { padding: 8px 14px 24px; }
    #hero { padding-bottom: 8vh; }
    #modemenu { right: 10px; }
    .vids { grid-template-columns: 1fr 1fr; gap: 8px; }
    .vid span { font-size: 12.5px; }
  }
</style>
</head>
<body>

<!-- ---------- sign in ---------- -->
<section id="gate" hidden>
  <form class="card" id="gateform" autocomplete="on">
    <span class="mark"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span>
    <h1 class="serif">Welcome to Fikrat</h1>
    <p class="muted">Sign in to start.</p>
    <input type="password" id="gatepass" placeholder="Password" autocomplete="current-password">
    <input type="password" id="gatekey" placeholder="OpenRouter key (sk-or-v1-…)" autocomplete="off" spellcheck="false" hidden>
    <input type="password" id="gatefik" placeholder="Fikrat password" autocomplete="off">
    <p class="err" id="gateerr"></p>
    <button class="accent-btn" type="submit" id="gatebtn">Sign in</button>
  </form>
</section>

<!-- ---------- app ---------- -->
<div id="app" hidden>
  <aside id="side">
    <div class="sidetop">
      <div class="brand serif"><span class="mark"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span>Fikrat</div>
      <button class="icon" id="hideside" title="Close sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <button id="newchat"><span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>New chat</button>
    <div class="label">Recents</div>
    <input id="search" type="search" placeholder="Search chats" autocomplete="off" hidden>
    <nav id="list"></nav>
    <button id="settingsbtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Settings</button>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="top">
      <button class="icon" id="showside" title="Open sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div class="title" id="chattitle"></div>
      <button class="icon" id="newchat2" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </header>

    <div id="scroller">
      <section id="hero">
        <h1 class="serif"><span class="mark" id="heromark"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span><span id="herotitle">Ask Fikrat</span></h1>
        <p id="herosub" class="muted"></p>
        <div id="heroslot"></div>
        <div id="chips"></div>
        <div class="banner" id="banner" hidden><span>The videos couldn’t load.</span><button class="soft-btn" id="retry">Try again</button></div>
      </section>
      <div id="thread"></div>
    </div>

    <div id="dock">
      <form id="composer">
        <div id="atts"></div>
        <textarea id="input" rows="1" placeholder="Ask about anything in the videos…"></textarea>
        <div class="row">

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- password lock (AES-GCM, key from PBKDF2) ----------

const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function aesKey(password, salt, iterations = 600000) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function unlockText(blob, password) {
  const all = unb64(blob);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(16, 28) }, await aesKey(password, all.slice(0, 16)), all.slice(28));
  return new TextDecoder().decode(plain);
}

// ---------- markdown ----------
// A small renderer for what chat models produce. Text is escaped first, so a reply can't inject HTML.

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = s
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?'"])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*|__(?=\S)([\s\S]*?\S)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`)
    .replace(/(^|[^*\w])\*(?=\S)([^*]*?\S)\*(?!\*)|(^|\W)_(?=\S)([^_]*?\S)_(?!\w)/g, (_, p1, a, p2, b) => `${p1 ?? p2}<em>${a ?? b}</em>`)
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
const LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const unesc = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');

function blocks(text) {
  const lines = esc(text).split('\n');
  const out = [];
  let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (!line.trim()) { flush(); continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push('<hr>'); continue; }
    if (/^&gt;/.test(line)) {
      flush();
      const q = [];
      while (i < lines.length && /^&gt;/.test(lines[i])) q.push(lines[i++].replace(/^&gt;\s?/, ''));
      i--;
      out.push(`<blockquote>${blocks(unesc(q.join('\n')))}</blockquote>`);
      continue;
    }
    if (line.includes('|') && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1] || '')) {
      flush();
      let html = `<table><thead><tr>${cells(line).map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>`;
      for (i += 2; i < lines.length && lines[i].includes('|'); i++) html += `<tr>${cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`;
      i--;
      out.push(html + '</tbody></table>');
      continue;
    }
    if (LIST.test(line)) {
      flush();
      const stack = [];
      let html = '';
      for (; i < lines.length; i++) {
        const lm = lines[i].match(LIST);
        if (!lm) {
          if (/^\s{2,}\S/.test(lines[i])) { html += ' ' + inline(lines[i].trim()); continue; }
          if (!lines[i].trim() && LIST.test(lines[i + 1] || '')) continue;
          break;
        }
        const indent = lm[1].length;
        const tag = /\d/.test(lm[2]) ? 'ol' : 'ul';
        while (stack.length > 1 && indent < stack[stack.length - 1].indent) html += `</li></${stack.pop().tag}>`;
        const top = stack[stack.length - 1];
        if (!top || indent > top.indent) {
          const n = parseInt(lm[2]);
          html += `<${tag}${tag === 'ol' && n !== 1 ? ` start="${n}"` : ''}><li>`;
          stack.push({ indent, tag });
        } else html += '</li><li>';
        html += inline(lm[3]);
      }
      while (stack.length) html += `</li></${stack.pop().tag}>`;
      i--;
      out.push(html);
      continue;
    }
    para.push(line);
  }
  flush();
  return out.join('');
}

function markdown(src) {
  let html = '';
  let last = 0;
  let m;
  const re = /^ {0,3}```([^\n`]*)\n([\s\S]*?)(?:\n {0,3}```[ \t]*(?=\n|$)|$(?![\s\S]))/gm;
  while ((m = re.exec(src))) {
    html += blocks(src.slice(last, m.index));
    html += `<div class="codeblock"><div class="bar"><span>${esc(m[1].trim().split(/\s/)[0] || 'code')}</span><button data-copy data-label="Copied">${ICON.copy}Copy</button></div><pre><code>${esc(m[2])}</code></pre></div>`;
    last = re.lastIndex;
  }
  return html + blocks(src.slice(last));
}

  if (b) copy(b.closest('.codeblock').querySelector('code').textContent, b);

// =====================================================================
// Library: the Fikrat videos plus any folders added, searched in this browser.
// Keyword search (BM25) and meaning search (vectors) are combined, so a question
// in English still finds Russian passages. Only the best few passages go to the AI.
// =====================================================================

const lib = {
  ready: false, promise: null, error: null, raw: null,
  docs: [],            // { name, title, id }  (id = YouTube id when the file name has one)
  chunks: [],          // { d, text }
  post: new Map(),     // term -> [chunk, count, chunk, count, ...]
  clen: [], total: 0,  // passage lengths, for BM25
  model: null, dim: 0, // embedding model used by the library (null = keyword search only)
  vec: new Int8Array(0), nvec: 0, // vectors for chunks 0..nvec-1
  folders: [],         // added folders: { id, name, files, start, count }
};

// Russian words change endings (Украины, Украине, Украину), so Cyrillic words are cut to 6 letters.
const stem = (t) => (t.length > 6 && /^[Ѐ-ӿ]+$/.test(t) ? t.slice(0, 6) : t);
const tokenize = (s) => (s.toLowerCase().match(/[\p{L}\p{N}]+/gu) || []).filter((t) => t.length < 40).map(stem);

// Same passage size as fikrat-build.mjs: 180 words, starting every 150.
function chunksOf(text) {
  const w = text.split(/\s+/).filter(Boolean);
  const out = [];
  for (let s = 0; s < w.length; s += 150) { out.push(w.slice(s, s + 180).join(' ')); if (s + 180 >= w.length) break; }
  return out;
}

function addDoc(name) {
  const base = name.replace(/\.(txt|md)$/i, '');
  const id = base.match(/\[([\w-]{11})\]\s*$/)?.[1] || null;
  lib.docs.push({ name, id, title: base.replace(/\s*\[[\w-]{11}\]\s*$/, '').trim() || base });
  return lib.docs.length - 1;
}

async function indexChunks(list) {
  for (let k = 0; k < list.length; k++) {
    const { d, text } = list[k];
    const i = lib.chunks.length;
    lib.chunks.push({ d, text });
    const toks = tokenize(lib.docs[d].title + ' ' + text);
    const tf = new Map();
    for (const t of toks) tf.set(t, (tf.get(t) || 0) + 1);
    for (const [t, n] of tf) { let p = lib.post.get(t); if (!p) lib.post.set(t, (p = [])); p.push(i, n); }
    lib.clen.push(toks.length);
    lib.total += toks.length;
    if (k % 400 === 399) await tick();
  }
}

function appendVectors(int8) {
  const need = (lib.nvec * lib.dim) + int8.length;
  if (lib.vec.length < need) { const v = new Int8Array(Math.max(need, lib.vec.length * 1.5 | 0)); v.set(lib.vec.subarray(0, lib.nvec * lib.dim)); lib.vec = v; }
  lib.vec.set(int8, lib.nvec * lib.dim);
  lib.nvec += int8.length / lib.dim;
}

// Download the encrypted library and unlock it with the Fikrat password.
async function fetchLibrary(pass) {
  let r;
  try { r = await fetch(state.settings.fikUrl || LIB_URL, { cache: 'no-cache' }); }
  catch { throw new Error('Couldn’t reach the Fikrat videos. Check the internet connection.'); }
  if (!r.ok) throw new Error('Couldn’t reach the Fikrat videos right now.');
  const buf = new Uint8Array(await r.arrayBuffer());
  const magic = String.fromCharCode(...buf.slice(0, 3));
  if (magic !== 'FK1' && magic !== 'FK2') throw new Error('The Fikrat library file looks damaged.');
  const key = await aesKey(pass, buf.slice(7, 23), new DataView(buf.buffer).getUint32(3));
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(23, 35) }, key, buf.slice(35)); }
  catch { throw new Error('That Fikrat password isn’t right.'); }
  const bytes = new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  if (magic === 'FK1') return { v: 1, files: JSON.parse(new TextDecoder().decode(bytes)) };
  const n = new DataView(bytes.buffer).getUint32(0);
  const meta = JSON.parse(new TextDecoder().decode(bytes.subarray(4, 4 + n)));
  return { v: 2, meta, vec: new Int8Array(bytes.buffer.slice(4 + n)) };
}

async function loadLibrary() {
  lib.error = null;
  refreshUI();
  try {
    const raw = lib.raw || (await fetchLibrary(session.get('fikpass') || ''));
    lib.raw = null;
    Object.assign(lib, { docs: [], chunks: [], post: new Map(), clen: [], total: 0, model: null, dim: 0, vec: new Int8Array(0), nvec: 0, folders: [] });
    if (raw.v === 2) {
      lib.model = raw.meta.model;
      lib.dim = raw.meta.dim;
      raw.meta.docs.forEach(addDoc);
      lib.vec = raw.vec;
      lib.nvec = Math.min(raw.meta.chunks.length, Math.floor(raw.vec.length / Math.max(1, lib.dim)));
      await indexChunks(raw.meta.chunks.map(([d, text]) => ({ d, text })));
    } else {
      const list = [];
      for (const [name, text] of raw.files) { const d = addDoc(name); for (const c of chunksOf(text)) list.push({ d, text: c }); }
      await indexChunks(list);
    }
    await loadSavedFolders();
    lib.ready = true;
    pumpVectors();
  } catch (e) {
    lib.error = e.message;
  }
  refreshUI();
}

function ensureLibrary() {
  if (lib.ready) return Promise.resolve();
  if (!lib.promise) lib.promise = loadLibrary().finally(() => { lib.promise = null; });
  return lib.promise;
}

// ---------- embeddings (meaning search) ----------

function toInt8(v) {
  const a = v.slice(0, lib.dim);
  let n = 0;
  for (const x of a) n += x * x;
  n = Math.sqrt(n) || 1;
  return Int8Array.from(a, (x) => Math.max(-127, Math.min(127, Math.round((x / n) * 127))));
}

async function embed(inputs, timeout) {
  const r = await fetch(API + '/embeddings', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.key, 'Content-Type': 'application/json', 'X-Title': 'Fikrat' },
    body: JSON.stringify({ model: lib.model, input: inputs, provider: { data_collection: 'deny' } }),
    signal: AbortSignal.timeout(timeout),
  });
  if (!r.ok) throw new Error('embed ' + r.status);
  const j = await r.json();
  return j.data.sort((a, b) => a.index - b.index).map((e) => e.embedding);
}

// Questions are turned into vectors while you type, so pressing Enter doesn't wait for it.
const qcache = new Map();
function embedQuery(text) {
  if (!lib.model || !text) return Promise.resolve(null);
  if (qcache.has(text)) return qcache.get(text);
  const p = embed(['Instruct: Given a question, retrieve passages from video transcripts that answer it\nQuery:' + text], 5000)
    .then(([e]) => { const v = toInt8(e); return Float32Array.from(v, (x) => x / 127); })
    .catch(() => null);
  qcache.set(text, p);
  if (qcache.size > 40) qcache.delete(qcache.keys().next().value);
  return p;
}

// Vectors for added folders are made in the background; keyword search works meanwhile.
let pumping = false;
async function pumpVectors() {
  if (pumping || !lib.model || !state.key) return;
  pumping = true;
  try {
    while (lib.nvec < lib.chunks.length) {
      const batch = lib.chunks.slice(lib.nvec, lib.nvec + 48);
      const vecs = await embed(batch.map((c) => lib.docs[c.d].title + '\n' + c.text), 60000);
      const out = new Int8Array(batch.length * lib.dim);
      vecs.forEach((v, i) => out.set(toInt8(v), i * lib.dim));
      appendVectors(out);
      for (const f of lib.folders) if (!f.saved && lib.nvec >= f.start + f.count) { f.saved = true; saveFolder(f); }
    }
  } catch { /* try again next time the page loads */ }
  pumping = false;
}

// ---------- search ----------

function keywordSearch(terms, k) {
  const N = lib.chunks.length, avg = lib.total / Math.max(1, N);
  const score = new Map();
  for (const t of terms) {
    const p = lib.post.get(t);
    if (!p) continue;
    const df = p.length / 2;
    const idf = Math.log(1 + (N - df + 0.5) / (df + 0.5));
    for (let i = 0; i < p.length; i += 2) {
      const c = p[i], tf = p[i + 1];
      score.set(c, (score.get(c) || 0) + idf * (tf * 2.2) / (tf + 1.2 * (0.25 + 0.75 * lib.clen[c] / avg)));
    }
  }
  return [...score].sort((a, b) => b[1] - a[1]).slice(0, k).map((x) => x[0]);
}

function vectorSearch(q, k) {
  if (!q || !lib.nvec) return [];
  const dim = lib.dim, v = lib.vec, n = lib.nvec;
  const top = []; // [score, chunk], kept sorted, best last
  let floor = -Infinity;
  for (let c = 0; c < n; c++) {
    let s = 0;
    const o = c * dim;
    for (let i = 0; i < dim; i++) s += q[i] * v[o + i];
    if (top.length < k || s > floor) {
      top.push([s, c]);
      top.sort((a, b) => a[0] - b[0]);
      if (top.length > k) top.shift();
      floor = top[0][0];
    }
  }
  return top.reverse().map((x) => x[1]);
}

// Short follow-ups ("and what about gold?") also use the previous question.
function queryFor(chat, text) {
  const prev = chat?.messages.filter((m) => m.role === 'user').map((m) => m.content);
  const before = prev && prev[prev.length - 1] === text ? prev[prev.length - 2] : prev?.[prev.length - 1];
  return before && text.split(/\s+/).length < 7 ? before + '\n' + text : text;
}

async function retrieve(text) {
  const qv = await embedQuery(text);
  const a = keywordSearch([...new Set(tokenize(text))], 40);
  const b = vectorSearch(qv, 40);
  const fused = new Map();
  a.forEach((c, i) => fused.set(c, (fused.get(c) || 0) + 1 / (60 + i)));
  b.forEach((c, i) => fused.set(c, (fused.get(c) || 0) + 1 / (60 + i)));
  const perDoc = new Map(), hits = [];
  for (const [c] of [...fused].sort((x, y) => y[1] - x[1])) {
    const d = lib.chunks[c].d;
    if ((perDoc.get(d) || 0) >= 2) continue;
    perDoc.set(d, (perDoc.get(d) || 0) + 1);
    hits.push({ n: hits.length + 1, d, text: lib.chunks[c].text });
    if (hits.length === 7) break;
  }
  return { hits, smart: !!qv };
}

// ---------- added folders (kept in this browser) ----------

function idb(mode, fn) {
  return new Promise((res, rej) => {
    const o = indexedDB.open('fikrat', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('folders', { keyPath: 'id' });
    o.onerror = () => rej(o.error);
    o.onsuccess = () => {
      const tx = o.result.transaction('folders', mode);
      const r = fn(tx.objectStore('folders'));
      tx.oncomplete = () => res(r?.result);
      tx.onerror = () => rej(tx.error);
    };
  });
}

function saveFolder(f) {
  const vec = lib.model && lib.nvec >= f.start + f.count ? lib.vec.slice(f.start * lib.dim, (f.start + f.count) * lib.dim) : null;
  return idb('readwrite', (s) => s.put({ id: f.id, name: f.name, files: f.files, model: lib.model, vec })).catch(() => toast('Couldn’t save the folder in this browser.'));
}

async function addFolderToLibrary(rec) {
  const list = [];
  for (const [name, text] of rec.files) { const d = addDoc(name); for (const c of chunksOf(text)) list.push({ d, text: c }); }
  const f = { id: rec.id, name: rec.name, files: rec.files, start: lib.chunks.length, count: list.length, saved: false };
  await indexChunks(list);
  lib.folders.push(f);
  // Reuse saved vectors when they line up; otherwise they're made again in the background.
  if (rec.vec && rec.model === lib.model && lib.nvec === f.start && rec.vec.length === f.count * lib.dim) { appendVectors(rec.vec); f.saved = true; }
  return f;
}

async function loadSavedFolders() {
  let recs = [];
  try { recs = (await idb('readonly', (s) => s.getAll())) || []; } catch {}
  for (const rec of recs.sort((a, b) => (a.id < b.id ? -1 : 1))) await addFolderToLibrary(rec);
}

async function walk(dir, out) {
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith('.')) continue;
    if (h.kind === 'directory') await walk(h, out);
    else if (/\.(txt|md)$/i.test(name)) out.push(await h.getFile());
  }
}

async function pickFolder() {
  closeMenus();
  if (window.showDirectoryPicker) {
    try {
      const h = await showDirectoryPicker({ mode: 'read' });
      const files = [];
      await walk(h, files);
      return addFolder(h.name, files);
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  $('#folderinput').click();
}
$('#folderinput').onchange = (e) => {
  const files = [...e.target.files].filter((f) => /\.(txt|md)$/i.test(f.name) && !f.name.startsWith('.'));
  const name = e.target.files[0]?.webkitRelativePath.split('/')[0] || 'Folder';
  e.target.value = '';
  addFolder(name, files);
};

async function addFolder(name, files) {
  if (!files.length) return toast('That folder has no text files in it.');
  toast(`Adding “${name}”…`);
  await ensureLibrary();
  if (!lib.ready) return toast('The library isn’t loaded yet. Try again in a moment.');
  const rec = { id: Date.now().toString(36), name, files: await Promise.all(files.map(async (f) => [f.name, await f.text()])) };
  const f = await addFolderToLibrary(rec);
  await saveFolder(f);
  setMode('fikrat');
  toast(`Added “${name}”. Ask away.`);
  renderSettings();
  pumpVectors();
}

function saveChats() {
  // Images aren't stored, only their names, so storage doesn't fill up.
  const slim = state.chats.map((c) => ({ ...c, messages: c.messages.filter((m) => !m.pending).map((m) => (m.files ? { ...m, files: m.files.map(({ url, ...f }) => f) } : m)) }));
  store.set('chats', slim);
}

function renderList() {
  const term = $('#search').value.trim().toLowerCase();
  $('#search').hidden = state.chats.length < 8;
  const list = [...state.chats]
    .sort((a, b) => b.updated - a.updated)
    .filter((c) => !term || c.title.toLowerCase().includes(term) || c.messages.some((m) => m.content.toLowerCase().includes(term)));
  $('#list').innerHTML = list.map((c) => `<div class="chat${c === state.chat ? ' on' : ''}" data-id="${c.id}"><span>${esc(c.title)}</span><button data-a="rename" title="Rename">${ICON.edit}</button><button data-a="delete" title="Delete">${ICON.trash}</button></div>`).join('')
    || `<div class="empty-list">${term ? 'No matches' : 'Your chats will appear here.'}</div>`;
}
$('#search').oninput = renderList;

$('#list').onclick = (e) => {
  const row = e.target.closest('.chat');
  const c = row && state.chats.find((x) => x.id === row.dataset.id);
  if (!c) return;
  const a = e.target.closest('button')?.dataset.a;
  if (a === 'delete') {
    if (!confirm(`Delete “${c.title}”?`)) return;
    state.chats = state.chats.filter((x) => x !== c);
    saveChats();
    if (state.chat === c) newChat(); else renderList();
  } else if (a === 'rename') {
    const inp = document.createElement('input');
    inp.value = c.title;
    row.replaceChildren(inp);
    inp.focus();
    inp.select();
    const done = (ok) => { if (ok && inp.value.trim()) { c.title = inp.value.trim(); saveChats(); } renderList(); refreshUI(); };
    inp.onkeydown = (ev) => { if (ev.key === 'Enter') done(true); if (ev.key === 'Escape') done(false); };
    inp.onblur = () => done(true);
  } else {
    openChat(c);
    $('#app').classList.remove('open');
  }
};

function newChat() {
  stop();
  state.chat = null;
  renderThread();
  renderList();

}

function openChat(c) {
  stop();
  state.chat = c;
  state.mode = c.mode;

}

function setMode(m) {

  store.set('mode', m);

// ---------- messages ----------

// [2] markers become the list of videos under the answer, in the order they were first used.
const CITE = /\s?\[(\d{1,2}(?:\s*,\s*\d{1,2})*)\]/g;
function citedNumbers(text) {
  const out = [];
  for (const m of text.matchAll(CITE)) for (const n of m[1].split(',')) { const k = +n; if (!out.includes(k)) out.push(k); }
  return out;
}
const render = (m) => markdown(m.sources ? m.content.replace(CITE, '') : m.content);

function videosHtml(m) {
  const used = citedNumbers(m.content).map((n) => m.sources.find((s) => s.n === n)).filter(Boolean);
  const seen = new Set();
  const cards = used.filter((s) => !seen.has(s.name) && seen.add(s.name)).map((s) => {
    const base = s.name.replace(/\.(txt|md)$/i, '');
    const id = base.match(/\[([\w-]{11})\]\s*$/)?.[1];
    const title = esc(base.replace(/\s*\[[\w-]{11}\]\s*$/, ''));
    const thumb = `<div class="thumb">${id ? `<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy">` : ''}<div class="play">${ICON.play}</div></div>`;
    return id ? `<a class="vid" href="https://youtu.be/${id}" target="_blank" rel="noopener" title="Watch on YouTube">${thumb}<span>${title}</span></a>` : `<div class="vid">${thumb}<span>${title}</span></div>`;
  });
  return cards.length ? `<div class="vids-label">From ${cards.length === 1 ? 'this video' : 'these videos'}</div><div class="vids">${cards.join('')}</div>` : '';
}

function renderThread() {
  const msgs = state.chat?.messages || [];
  $('#thread').innerHTML = '';
  msgs.forEach((m, i) => $('#thread').appendChild(msgEl(m, i === msgs.length - 1)));
}

function msgEl(m, isLast) {
  const el = document.createElement('div');
  el.className = 'msg ' + m.role;
  if (m.role === 'user') {
    if (m.files?.length) el.insertAdjacentHTML('beforeend', `<div class="files">${m.files.map((f) => (f.url ? `<img src="${esc(f.url)}" alt="">` : `<span class="chip">📎 ${esc(f.name)}</span>`)).join('')}</div>`);
    if (m.content) el.insertAdjacentHTML('beforeend', `<div class="bubble">${esc(m.content)}</div>`);
  } else {
    el.insertAdjacentHTML('beforeend', m.content ? `<div class="md">${render(m)}</div>` : '<div class="md"><span class="dots"><i></i><i></i><i></i></span></div>');
    if (m.sources && !m.pending) el.insertAdjacentHTML('beforeend', videosHtml(m));
  }
  if (!m.pending) {
    const acts = document.createElement('div');
    acts.className = 'actions';
    const btn = (icon, title, fn) => { const b = document.createElement('button'); b.innerHTML = icon; b.title = title; b.onclick = () => fn(b); acts.appendChild(b); };
    btn(ICON.copy, 'Copy', (b) => copy(m.sources ? m.content.replace(CITE, '') : m.content, b));
    if (m.role === 'assistant' && isLast) btn(ICON.redo, 'Try again', () => { if (!state.controller) { state.chat.messages.pop(); send(); } });
    el.appendChild(acts);
  }
  return el;
}

// Stored messages to what OpenRouter expects. Images are only sent while still in memory.
function toApi(m) {
  if (m.role !== 'user') return { role: m.role, content: m.content.replace(CITE, '') };
  let text = m.content;
  const images = [];
  for (const f of m.files || []) {
    if (f.text != null) text += `\n\n<file name="${f.name}">\n${f.text}\n</file>`;
    else if (f.url) images.push({ type: 'image_url', image_url: { url: f.url } });
    else text += `\n\n[image "${f.name}" was attached earlier]`;
  }
  return images.length ? { role: 'user', content: [{ type: 'text', text: text || ' ' }, ...images] } : { role: 'user', content: text };
}

function stop() { state.controller?.abort(); }

async function send() {
  const chat = state.chat;
  const fk = chat.mode === 'fikrat';
  const reply = { role: 'assistant', content: '', pending: true };
  chat.messages.push(reply);
  renderThread();
  refreshUI();
  const el = $('#thread').lastElementChild;
  $('#scroller').scrollTop = 1e9;

  state.controller = new AbortController();
  $('#send').hidden = true;
  $('#stop').hidden = false;

  const t0 = performance.now();
  const stats = { mode: fk ? 'Fikrat' : 'Chat' };
  let error = null;
  let painting = false;
  const paint = () => {
    if (painting) return;
    painting = true;
    requestAnimationFrame(() => {
      painting = false;
      el.firstElementChild.innerHTML = render(reply);
      const s = $('#scroller');
      if (s.scrollHeight - s.scrollTop - s.clientHeight < 160) s.scrollTop = 1e9;
    });
  };

  try {
    const history = chat.messages.slice(0, -1);
    let messages, primary;
    if (fk) {
      if (!lib.ready) await ensureLibrary();
      if (!lib.ready) throw new Error('The videos couldn’t load. Please press “Try again”.');
      const asked = history[history.length - 1].content;
      const { hits, smart } = await retrieve(queryFor(chat, asked));
      stats.search = `${hits.length} passages, ${smart ? 'meaning + keyword' : 'keyword'} search, ${Math.round(performance.now() - t0)} ms`;
      reply.sources = hits.map((h) => ({ n: h.n, name: lib.docs[h.d].name }));
      const passages = hits.map((h) => `[${h.n}] From the video “${lib.docs[h.d].title}”:\n${h.text}`).join('\n\n');
      messages = [{ role: 'system', content: FIK_PROMPT + '\n\n' + (passages || '(No passages were found.)') }, ...history.slice(-5).map(toApi)];
      primary = state.settings.fikModel || FIK_MODEL;
    } else {
      messages = [{ role: 'system', content: state.settings.system || DEFAULT_PROMPT }, ...history.slice(-20).map(toApi)];
      primary = state.settings.chatModel || CHAT_MODEL;
    }
    const body = {
      models: [primary, ...BACKUP_MODELS.filter((m) => m !== primary)].slice(0, 3),
      messages,
      stream: true,
      usage: { include: true },
      // Only providers that don't store or train on what you send; fastest first.
      provider: { data_collection: 'deny', sort: 'latency' },
    };
    if (fk) { body.max_tokens = 1200; body.temperature = 0.3; }
    if (!fk && state.web) body.plugins = [{ id: 'web' }];
    const r = await fetch(API + '/chat/completions', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + state.key, 'Content-Type': 'application/json', 'X-Title': 'Fikrat' },
      body: JSON.stringify(body),
      signal: state.controller.signal,
    });
    if (!r.ok) {
      let msg = `Something went wrong (${r.status}). Please try again.`;
      try { msg = (await r.json()).error?.message || msg; } catch {}
      if (r.status === 401) msg = 'The AI service rejected the site key. The site owner needs to update it.';
      if (r.status === 402) msg = 'The AI service is out of credit. The site owner needs to top it up.';
      throw new Error(msg);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith('data:') || line === 'data: [DONE]') continue;
        let j;
        try { j = JSON.parse(line.slice(5)); } catch { continue; }
        if (j.error) { error = j.error.message; continue; }
        if (j.model) stats.model = j.model;
        if (j.usage) stats.usage = j.usage;
        const d = j.choices?.[0]?.delta?.content;
        if (d) {
          if (stats.first == null) stats.first = performance.now() - t0;
          reply.content += d;
          paint();
        }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') error = e.message;
  }

  stats.total = performance.now() - t0;
  state.last = stats;
  state.controller = null;
  delete reply.pending;
  $('#send').hidden = false;
  $('#stop').hidden = true;
  updateSend();
  if (!reply.content) chat.messages.pop();
  chat.updated = Date.now();
  saveChats();
  if (state.chat === chat) {
    renderThread();
    if (error) $('#thread').insertAdjacentHTML('beforeend', `<div class="errbox">${esc(error)}</div>`);
    $('#scroller').scrollTop = 1e9;
  }
  renderList();
  refreshUI();
}

// ---------- composer ----------

const input = $('#input');
function updateSend() { $('#send').disabled = !!state.controller || (!input.value.trim() && !state.files.length); }
function autosize() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }

let prefetchTimer;
input.oninput = () => {
  autosize();
  updateSend();
  clearTimeout(prefetchTimer);
  const text = input.value.trim();
  if (state.mode === 'fikrat' && lib.model && text.length > 3) prefetchTimer = setTimeout(() => embedQuery(queryFor(state.chat, text)), 300);
};
input.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches) {
    e.preventDefault();
    $('#composer').requestSubmit();
  }
};

$('#composer').onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (state.controller || (!text && !state.files.length)) return;
  if (!state.chat) {
    state.chat = { id: Date.now().toString(36), title: (text || state.files[0].name).slice(0, 60), updated: Date.now(), mode: state.mode, messages: [] };
    state.chats.push(state.chat);
  }
  state.chat.messages.push({ role: 'user', content: text, ...(state.files.length ? { files: state.files } : {}) });
  input.value = '';
  state.files = [];
  $('#atts').innerHTML = '';
  autosize();
  updateSend();
  send();
};

$('#stop').onclick = stop;

$('#chips').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  input.value = b.textContent;
  input.dispatchEvent(new Event('input'));
  $('#composer').requestSubmit();
};

// Attachments: images are shrunk and sent once; text files are included as text.
$('#file').onchange = async (e) => {
  for (const f of e.target.files) {
    if (f.type.startsWith('image/')) {
      const bmp = await createImageBitmap(f);
      const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = bmp.width * s;
      c.height = bmp.height * s;
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      state.files.push({ name: f.name, url: c.toDataURL('image/jpeg', 0.82) });
    } else if (f.size < 200e3) {
      state.files.push({ name: f.name, text: await f.text() });
    } else {
      toast(`${f.name} is too big`);
    }
  }
  e.target.value = '';
  $('#atts').innerHTML = state.files.map((f) => (f.url ? `<img src="${esc(f.url)}" alt="">` : `<span class="chip">📎 ${esc(f.name)}</span>`)).join('');
  updateSend();
};

function refreshUI() {
  const fk = state.mode === 'fikrat';
  const empty = !state.chat?.messages.length;
  // The composer sits in the middle on a fresh chat, and at the bottom once you're talking.
  const slot = empty ? $('#heroslot') : $('#dock');
  if ($('#composer').parentElement !== slot) slot.prepend($('#composer'));
  $('#hero').hidden = !empty;
  $('#fine').hidden = empty;
  $('#chattitle').textContent = empty ? '' : state.chat.title;

  $('#herotitle').textContent = fk ? 'Ask Fikrat' : 'How can I help?';
  $('#heromark').hidden = !fk;
  $('#herosub').textContent = fk ? (lib.ready ? 'Ask anything about the videos, in any language.' : lib.error ? '' : 'Getting the videos ready…') : 'A general assistant for anything.';
  $('#chips').hidden = !fk || !lib.ready;
  if (!$('#chips').childElementCount) $('#chips').innerHTML = EXAMPLES.map((t) => `<button type="button">${esc(t)}</button>`).join('');
  $('#banner').hidden = !(fk && lib.error);
  if (lib.error) $('#banner span').textContent = lib.error;

  $('#modetext').textContent = fk ? 'Fikrat' : 'Chat';
  $$('#modemenu .check').forEach((c) => (c.style.visibility = c.closest('button').dataset.mode === state.mode ? 'visible' : 'hidden'));
  $('#webitem').hidden = fk;
  $('#webcheck').hidden = !state.web;
  $('#webpill').hidden = fk || !state.web;
  input.placeholder = fk ? (lib.ready || lib.error ? 'Ask about anything in the videos…' : 'Getting ready… you can type already') : 'How can I help you today?';
  $('#fine').textContent = fk ? 'Answers come only from the videos. Tap a video to check.' : 'AI can make mistakes. Check important information.';
}

// ---------- settings ----------

function renderSettings() {
  const vids = lib.docs.length - lib.folders.reduce((n, f) => n + f.files.length, 0);
  $('#libinfo').innerHTML = lib.ready
    ? `<b>${vids.toLocaleString()}</b> videos · <b>${lib.chunks.length.toLocaleString()}</b> passages<br>Search: ${lib.model ? `meaning + keyword (${esc(lib.model)}, ${lib.dim} dims, ${lib.nvec.toLocaleString()} vectors)` : 'keyword only (rebuild the library to add meaning search)'}`
    : lib.error ? esc(lib.error) : 'Loading…';
  $('#folders').innerHTML = lib.folders.map((f) => `<div class="folder"><span>📁 ${esc(f.name)} · ${f.files.length} files${lib.model && lib.nvec < f.start + f.count ? ' · preparing' : ''}</span><button class="soft-btn" data-rm="${esc(f.id)}" style="font-size:13px;padding:5px 10px">Remove</button></div>`).join('');
  const s = state.last;
  $('#lastinfo').innerHTML = s
    ? [
        `${esc(s.mode)}${s.model ? ` · <b>${esc(s.model)}</b>` : ''}`,
        s.search ? `Search: ${esc(s.search)}` : '',
        `First words after <b>${s.first != null ? (s.first / 1000).toFixed(2) + ' s' : '–'}</b> · finished in ${(s.total / 1000).toFixed(1)} s`,
        s.usage ? `Tokens: ${s.usage.prompt_tokens?.toLocaleString() ?? '?'} in · ${s.usage.completion_tokens?.toLocaleString() ?? '?'} out${s.usage.cost != null ? ` · cost $${(+s.usage.cost).toFixed(5)}` : ''}` : '',
      ].filter(Boolean).join('<br>')
    : 'Nothing yet.';
  $('#fikmodel').placeholder = FIK_MODEL;
  $('#chatmodel').placeholder = CHAT_MODEL;
  $('#fikmodel').value = state.settings.fikModel || '';
  $('#chatmodel').value = state.settings.chatModel || '';
  $('#system').value = state.settings.system || DEFAULT_PROMPT;
  applyTheme();
}

$('#settingsbtn').onclick = () => { renderSettings(); $('#settings').showModal(); $('#app').classList.remove('open'); };
$('#savesettings').onclick = () => {
  state.settings.fikModel = $('#fikmodel').value.trim();
  state.settings.chatModel = $('#chatmodel').value.trim();
  const sys = $('#system').value.trim();
  state.settings.system = sys === DEFAULT_PROMPT.trim() ? '' : sys;
  store.set('settings', state.settings);
  toast('Saved');
};
$('#addfolder2').onclick = () => { $('#settings').close(); pickFolder(); };
$('#reloadlib').onclick = () => location.reload();
$('#folders').onclick = async (e) => {
  const id = e.target.closest('[data-rm]')?.dataset.rm;
  if (!id || !confirm('Remove this folder from Fikrat? Your files on the computer are not touched.')) return;
  await idb('readwrite', (s) => s.delete(id)).catch(() => {});
  location.reload();
};
$('#logout').onclick = () => {
  if (!confirm('Sign out? Your chats stay saved in this browser.')) return;
  session.clear();
  location.reload();
};
$$('[data-close]').forEach((b) => (b.onclick = () => b.closest('dialog').close()));
$$('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));

// ---------- sidebar ----------

const narrow = () => innerWidth <= 800;
$('#hideside').onclick = () => (narrow() ? $('#app').classList.remove('open') : $('#app').classList.add('noside'));
$('#showside').onclick = () => { if (narrow()) $('#app').classList.add('open'); else $('#app').classList.remove('noside'); };
$('#scrim').onclick = () => $('#app').classList.remove('open');
$('#newchat').onclick = () => { $('#app').classList.remove('open'); newChat(); };
$('#newchat2').onclick = newChat;

// ---------- sign in ----------

function showGate() {
  $('#app').hidden = true;
  $('#gate').hidden = false;
  $('#gatepass').hidden = !LOCKED;
  $('#gatekey').hidden = !!LOCKED;
  (LOCKED ? $('#gatepass') : $('#gatekey')).focus();
}

$('#gateform').onsubmit = async (e) => {
  e.preventDefault();
  $('#gateerr').textContent = '';
  $('#gatebtn').disabled = true;
  $('#gatebtn').textContent = 'Signing in…';
  try {
    let key;
    if (LOCKED) {
      try { key = await unlockText(LOCKED, $('#gatepass').value); }
      catch { throw new Error('That password isn’t right.'); }
    } else {
      key = $('#gatekey').value.trim();
      if (!key.startsWith('sk-')) throw new Error("That doesn't look like an OpenRouter key.");
    }
    const fikpass = $('#gatefik').value;
    if (!fikpass) throw new Error('Please enter the Fikrat password too.');
    lib.raw = await fetchLibrary(fikpass); // checks the Fikrat password now; the app then opens ready
    session.set('fikpass', fikpass);
    state.key = key;
    session.set('key', key);
    session.set('lock', LOCKED); // if the site key changes, the password is asked for again
    startApp();
  } catch (err) {
    $('#gateerr').textContent = err.message;
  } finally {
    $('#gatebtn').disabled = false;
    $('#gatebtn').textContent = 'Sign in';
  }
};

// ---------- start ----------

function startApp() {
  $('#gate').hidden = true;
  $('#app').hidden = false;
  if (narrow()) $('#app').classList.remove('open');
  renderThread();
  renderList();
  ensureLibrary(); // loads in the background; questions wait for it if needed
  refreshUI();
  input.focus();
}

applyTheme();
// Stay signed in only when an open tab is refreshed. Browsers can bring a closed
// tab's storage back when it's reopened, so any other way in asks again.
const reloaded = performance.getEntriesByType('navigation')[0]?.type === 'reload';
if (!reloaded) { session.clear(); state.key = null; }
if (state.key && session.get('fikpass') && (!LOCKED || session.get('lock') === LOCKED)) startApp();
else showGate();
</script>
</body>
