<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#171719">
<title>Parley</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2310a37f'/%3E%3Cpath d='M150 156h170a58 58 0 0 1 58 58v70a58 58 0 0 1-58 58h-74l-66 52v-52h-30a58 58 0 0 1-58-58v-70a58 58 0 0 1 58-58Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #212124; --side: #171719; --panel: #2b2b2f; --raise: #34343a;
    --ink: #ececec; --dim: #a0a0a8; --faint: #6c6c75; --line: #3a3a40;
    --accent: #10a37f; --danger: #ef6a6a; --user: #303035; --code: #0d0d0f;
    --shadow: 0 10px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fff; --side: #f7f7f8; --panel: #fff; --raise: #ececf1;
    --ink: #1f1f23; --dim: #5d5d66; --faint: #9a9aa3; --line: #e3e3e8;
    --user: #f1f1f4; --code: #f6f6f8; --shadow: 0 10px 40px rgba(0,0,0,.14);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; border-radius: 10px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 8px; }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input, textarea, select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .primary { background: var(--ink); color: var(--bg); font-weight: 600; justify-content: center; }
  .ghost:hover, .icon:hover { background: var(--raise); }
  .icon { padding: 8px; color: var(--dim); }
  .icon:hover { color: var(--ink); }
  .line { border: 1px solid var(--line); }
  .muted { color: var(--dim); }
  .small { font-size: 13px; }
  .err { color: var(--danger); font-size: 14px; min-height: 1.3em; margin: 6px 0; }
  .grow { flex: 1; }

  /* ---------- key screen ---------- */
  #gate { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; box-shadow: var(--shadow); text-align: center; }
  .card h1 { margin: 12px 0 4px; font-size: 23px; }
  .card p { margin: 0 0 16px; }
  .card input { margin-bottom: 4px; }
  .card .primary { width: 100%; padding: 11px; }
  .logo { width: 48px; height: 48px; }

  /* ---------- layout ---------- */
  #app { display: flex; height: 100dvh; overflow: hidden; }
  #side { width: 260px; flex: none; background: var(--side); display: flex; flex-direction: column; padding: 8px; transition: margin-left .2s; }
  #app.noside #side { margin-left: -260px; }
  .newchat { width: 100%; justify-content: flex-start; font-weight: 500; }
  #search { margin: 6px 0 8px; background: var(--raise); border: 0; padding: 8px 12px; }
  #list { flex: 1; overflow-y: auto; }
  .group { font-size: 12px; font-weight: 600; color: var(--faint); padding: 12px 10px 4px; }
  .chat { display: flex; align-items: center; border-radius: 10px; }
  .chat:hover, .chat.on { background: var(--raise); }
  .chat span { flex: 1; min-width: 0; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; cursor: pointer; }
  .chat button { padding: 5px; color: var(--dim); opacity: 0; }
  .chat:hover button, .chat.on button { opacity: 1; }
  .chat button svg { width: 15px; height: 15px; }
  .chat input { margin: 3px; padding: 5px 8px; font-size: 14px; }

  #keybox { border-top: 1px solid var(--line); padding: 10px 6px 4px; font-size: 13px; }
  #keybox .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  #keybox .btns button { padding: 5px 10px; font-size: 13px; border: 1px solid var(--line); }
  #keybox .btns button:hover { background: var(--raise); }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #top { display: flex; align-items: center; gap: 4px; padding: 8px 10px 4px; }
  #modelbtn { font-size: 17px; font-weight: 600; padding: 6px 10px; }
  #modelbtn span { max-width: 55vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #scroller { flex: 1; overflow-y: auto; }
  #welcome { height: 100%; display: grid; place-items: center; text-align: center; padding: 20px; }
  #welcome h2 { font-size: 28px; font-weight: 600; margin: 0; }
  #thread { max-width: 780px; margin: 0 auto; padding: 8px 16px 24px; }

  .msg { margin-bottom: 22px; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble { background: var(--user); border-radius: 20px; padding: 10px 16px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .files { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 6px; }
  .files img { max-width: 200px; max-height: 200px; border-radius: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--raise); border-radius: 10px; padding: 5px 10px; font-size: 13px; }
  .actions { display: flex; gap: 2px; margin-top: 4px; align-items: center; min-height: 30px; }
  .actions button { padding: 6px; color: var(--dim); border-radius: 8px; }
  .actions button:hover { background: var(--raise); color: var(--ink); }
  .actions svg { width: 16px; height: 16px; }
  .actions .tag { font-size: 12px; color: var(--faint); margin-left: 6px; }
  .msg.user .actions { opacity: 0; }
  .msg.user:hover .actions { opacity: 1; }

  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md table, .md blockquote { margin: 0 0 14px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 20px 0 8px; line-height: 1.3; }
  .md h1 { font-size: 1.45em; } .md h2 { font-size: 1.25em; } .md h3 { font-size: 1.1em; }
  .md ul, .md ol { padding-left: 24px; }
  .md li { margin: 3px 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--dim); }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  .md th { background: var(--raise); }
  .md :not(pre) > code { background: var(--raise); padding: 2px 6px; border-radius: 6px; font-size: .88em; }
  code, pre { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .codeblock { border-radius: 12px; overflow: hidden; margin: 0 0 14px; background: var(--code); border: 1px solid var(--line); }
  .codeblock .bar { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px 3px 14px; font-size: 12px; color: var(--dim); background: var(--raise); }
  .codeblock .bar button { font-size: 12px; padding: 4px 8px; color: var(--dim); }
  .codeblock .bar svg { width: 14px; height: 14px; }
  .codeblock pre { margin: 0; padding: 14px; overflow-x: auto; font-size: 13.5px; line-height: 1.5; }
  .think { margin-bottom: 10px; border-left: 2px solid var(--line); padding-left: 12px; color: var(--dim); font-size: 14px; }
  .think summary { cursor: pointer; color: var(--faint); }
  .think div { white-space: pre-wrap; margin-top: 6px; }
  .cursor::after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); margin-left: 4px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .errbox { border: 1px solid var(--danger); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-top: 8px; }

  #composer { width: calc(100% - 32px); max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 8px 10px; }
  #input { border: 0; background: none; resize: none; padding: 8px 8px 4px; max-height: 40vh; display: block; }
  #input:focus-visible { outline: none; }
  #composer .row { display: flex; align-items: center; gap: 4px; }
  #atts { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px; }
  #atts:empty { display: none; }
  #atts img { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--dim); }
  .pill svg { width: 16px; height: 16px; }
  .pill[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .send { width: 36px; height: 36px; padding: 0; border-radius: 50%; justify-content: center; background: var(--ink); color: var(--bg); }
  .send svg { width: 18px; height: 18px; stroke-width: 2.4; }
  #stop svg { fill: currentColor; stroke: none; }
  .fine { text-align: center; font-size: 12px; color: var(--faint); margin: 8px 0 10px; }

  dialog { width: min(520px, calc(100vw - 24px)); max-height: min(640px, calc(100dvh - 40px)); padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dhead { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 18px; border-bottom: 1px solid var(--line); }
  .dhead h3 { margin: 0; flex: 1; font-size: 17px; }
  .dbody { overflow-y: auto; padding: 14px 18px 18px; }
  .dbody label { display: block; font-size: 14px; color: var(--dim); margin: 12px 0 6px; }
  .dbody .primary { margin-top: 12px; }
  .mrow { width: 100%; display: flex; justify-content: space-between; gap: 10px; text-align: left; padding: 9px 10px; }
  .mrow:hover, .mrow.focus { background: var(--raise); }
  .mrow.on { color: var(--accent); }
  .mrow small { color: var(--faint); white-space: nowrap; }

  #toast { position: fixed; inset: auto auto 24px 50%; margin: 0; border: 0; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 12px; font-size: 14px; }

  .mobile-only { display: none; }
  @media (max-width: 800px) {
    .mobile-only { display: inline-flex; }
    #side { position: fixed; inset: 0 auto 0 0; z-index: 10; width: min(300px, 85vw); transform: translateX(-100%); transition: transform .2s; margin: 0 !important; box-shadow: var(--shadow); }
    #app.open #side { transform: none; }
    #app.open #scrim { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.45); }
    .chat button, .msg.user .actions { opacity: 1; }
    #composer { width: calc(100% - 20px); }
    .pill span { display: none; }
  }
</style>
</head>
<body>

<!-- ---------- key screen ---------- -->
<section id="gate" hidden>
  <form class="card" id="gateform">
    <svg class="logo" viewBox="0 0 512 512" style="stroke:none"><rect width="512" height="512" rx="112" fill="#10a37f"/><path d="M150 156h170a58 58 0 0 1 58 58v70a58 58 0 0 1-58 58h-74l-66 52v-52h-30a58 58 0 0 1-58-58v-70a58 58 0 0 1 58-58Z" fill="#fff"/></svg>
    <div id="gate-unlock" hidden>
      <h1>Welcome to Parley</h1>
      <p class="muted">Enter the password to start chatting.</p>
      <input type="password" id="gatepass" placeholder="Password" autocomplete="current-password">
    </div>
    <div id="gate-new" hidden>
      <h1>Paste your key</h1>
      <p class="muted">Get an OpenRouter key at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>. It stays in this browser.</p>
      <input type="password" id="gatekey" placeholder="sk-or-v1-…" autocomplete="off" spellcheck="false">
    </div>
    <p class="err" id="gateerr"></p>
    <button class="primary" type="submit" id="gatebtn">Continue</button>
  </form>
</section>

<!-- ---------- app ---------- -->
<div id="app" hidden>
  <aside id="side">
    <button class="ghost newchat" id="newchat">
      <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>New chat
    </button>
    <input id="search" type="search" placeholder="Search chats" autocomplete="off">
    <nav id="list"></nav>

    <div id="keybox">
      <div class="btns">
        <button id="settingsbtn">Settings</button>
        <button id="logout">Log out</button>
      </div>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="top">
      <button class="icon" id="toggleside" title="Sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <button class="ghost" id="modelbtn"><span id="modelname">Choose a model</span><svg viewBox="0 0 24 24" style="width:16px"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="grow"></div>
      <button class="icon mobile-only" id="newchat2" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </header>

    <div id="scroller">
      <div id="welcome"><h2>What can I help with?</h2></div>
      <div id="thread"></div>
    </div>

    <form id="composer">
      <div id="atts"></div>
      <textarea id="input" rows="1" placeholder="Message Parley"></textarea>
      <div class="row">
        <button type="button" class="icon" id="attach" title="Attach images or text files"><svg viewBox="0 0 24 24"><path d="m21 11-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l8-8"/></svg></button>
        <button type="button" class="pill" id="web" aria-pressed="false" title="Let the model search the web"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Search</span></button>
        <div class="grow"></div>
        <button type="submit" class="send" id="send" title="Send" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
        <button type="button" class="send" id="stop" title="Stop" hidden><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
      </div>
      <input type="file" id="file" multiple hidden accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css">
    </form>
    <p class="fine">AI can make mistakes. Check important info.</p>
  </main>
</div>

<!-- ---------- model picker ---------- -->
<dialog id="models">
  <div class="dhead"><input id="modelsearch" placeholder="Search models (try: free, claude, gpt)" autocomplete="off"><button class="icon" data-close>✕</button></div>
  <div class="dbody" id="modellist"></div>
</dialog>

<!-- ---------- settings ---------- -->
<dialog id="settings">
  <div class="dhead"><h3>Settings</h3><button class="icon" data-close>✕</button></div>
  <div class="dbody">
    <label>Custom instructions<textarea id="system" rows="5" placeholder="Anything the assistant should know about you or how to answer"></textarea></label>
    <label>Theme<select id="theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
    <button class="primary" id="savesettings" style="width:100%">Save</button>
    <p class="muted small">Chats are saved in this browser only.</p>
  </div>
</dialog>

<div id="toast" popover="manual"></div>

<script>
'use strict';

// The site's OpenRouter key, locked with the site password.
const LOCKED = /*LOCKED*/"zIW+4fMSuvfRgZOMJZINl9/lEmS+YKJYxxkkEOCVi3HEOrEl5Werr2t/udRgovmps/FPkxVL658Obng8f4eC96/i6ozdD/o52As21S08D18LKe9Oc2rUn8ASLBnSDHSpV3HmUN1UCo5PsBhJIMw/514FLhEY"/*LOCKED*/;

const API = 'https://openrouter.ai/api/v1';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

const ICON = {
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>',
  redo: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>',
};

// ---------- storage (all in this browser) ----------

const store = {
  get(k, fallback) { try { const v = localStorage.getItem('parley.' + k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem('parley.' + k, JSON.stringify(v)); return true; } catch { toast('Browser storage is full. Delete some old chats.'); return false; } },
  del(k) { try { localStorage.removeItem('parley.' + k); } catch {} },
};

const state = {
  key: store.get('key', null),
  chats: store.get('chats', []),
  settings: store.get('settings', {}),
  chat: null,        // the open chat
  files: [],         // attachments waiting to be sent
  web: false,
  models: null,
  controller: null,
};

// ---------- helpers ----------

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  try { t.hidePopover(); t.showPopover(); } catch {}
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { try { t.hidePopover(); } catch {} }, 2600);
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch { return toast('Copy failed'); }
  if (btn) { const old = btn.innerHTML; btn.innerHTML = ICON.check + (btn.dataset.label || ''); setTimeout(() => (btn.innerHTML = old), 1400); }
}

// ---------- password lock (AES-GCM, key from PBKDF2) ----------

const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function passKey(password, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function unlockText(blob, password) {
  const all = unb64(blob);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(16, 28) }, await passKey(password, all.slice(0, 16)), all.slice(28));
  return new TextDecoder().decode(plain);
}

// ---------- key screen ----------

function showGate() {
  $('#app').hidden = true;
  $('#gate').hidden = false;
  $('#gate-unlock').hidden = !LOCKED;
  $('#gate-new').hidden = !!LOCKED;
  (LOCKED ? $('#gatepass') : $('#gatekey')).focus();
}

$('#gateform').onsubmit = async (e) => {
  e.preventDefault();
  $('#gateerr').textContent = '';
  $('#gatebtn').disabled = true;
  try {
    let key;
    if (LOCKED) {
      try { key = await unlockText(LOCKED, $('#gatepass').value); }
      catch { throw new Error('Wrong password.'); }
    } else {
      key = $('#gatekey').value.trim();
      if (!key.startsWith('sk-')) throw new Error("That doesn't look like an OpenRouter key.");
    }
    state.key = key;
    store.set('key', key);
    store.set('lock', LOCKED); // if the site key changes, everyone is asked for the password again
    startApp();
  } catch (err) {
    $('#gateerr').textContent = err.message;
  } finally {
    $('#gatebtn').disabled = false;
  }
};

// ---------- markdown ----------
// A small renderer for what chat models produce. Text is escaped first, so a reply can't inject HTML.

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = s
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?'"])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*|__(?=\S)([\s\S]*?\S)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`)
    .replace(/(^|[^*\w])\*(?=\S)([^*]*?\S)\*(?!\*)|(^|\W)_(?=\S)([^_]*?\S)_(?!\w)/g, (_, p1, a, p2, b) => `${p1 ?? p2}<em>${a ?? b}</em>`)
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
const LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const unesc = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');

function blocks(text) {
  const lines = esc(text).split('\n');
  const out = [];
  let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (!line.trim()) { flush(); continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push('<hr>'); continue; }
    if (/^&gt;/.test(line)) {
      flush();
      const q = [];
      while (i < lines.length && /^&gt;/.test(lines[i])) q.push(lines[i++].replace(/^&gt;\s?/, ''));
      i--;
      out.push(`<blockquote>${blocks(unesc(q.join('\n')))}</blockquote>`);
      continue;
    }
    if (line.includes('|') && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1] || '')) {
      flush();
      let html = `<table><thead><tr>${cells(line).map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>`;
      for (i += 2; i < lines.length && lines[i].includes('|'); i++) html += `<tr>${cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`;
      i--;
      out.push(html + '</tbody></table>');
      continue;
    }
    if (LIST.test(line)) {
      flush();
      const stack = [];
      let html = '';
      for (; i < lines.length; i++) {
        const lm = lines[i].match(LIST);
        if (!lm) {
          if (/^\s{2,}\S/.test(lines[i])) { html += ' ' + inline(lines[i].trim()); continue; }
          if (!lines[i].trim() && LIST.test(lines[i + 1] || '')) continue;
          break;
        }
        const indent = lm[1].length;
        const tag = /\d/.test(lm[2]) ? 'ol' : 'ul';
        while (stack.length > 1 && indent < stack[stack.length - 1].indent) html += `</li></${stack.pop().tag}>`;
        const top = stack[stack.length - 1];
        if (!top || indent > top.indent) {
          const n = parseInt(lm[2]);
          html += `<${tag}${tag === 'ol' && n !== 1 ? ` start="${n}"` : ''}><li>`;
          stack.push({ indent, tag });
        } else html += '</li><li>';
        html += inline(lm[3]);
      }
      while (stack.length) html += `</li></${stack.pop().tag}>`;
      i--;
      out.push(html);
      continue;
    }
    para.push(line);
  }
  flush();
  return out.join('');
}

function markdown(src) {
  let html = '';
  let last = 0;
  let m;
  const re = /^ {0,3}```([^\n`]*)\n([\s\S]*?)(?:\n {0,3}```[ \t]*(?=\n|$)|$(?![\s\S]))/gm;
  while ((m = re.exec(src))) {
    html += blocks(src.slice(last, m.index));
    html += `<div class="codeblock"><div class="bar"><span>${esc(m[1].trim().split(/\s/)[0] || 'code')}</span><button data-copy data-label="Copied">${ICON.copy}Copy</button></div><pre><code>${esc(m[2])}</code></pre></div>`;
    last = re.lastIndex;
  }
  return html + blocks(src.slice(last));
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-copy]');
  if (b) copy(b.closest('.codeblock').querySelector('code').textContent, b);
});

// ---------- theme ----------

const darkMq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const pref = state.settings.theme || 'system';
  const dark = pref === 'dark' || (pref === 'system' && darkMq.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
darkMq.addEventListener('change', applyTheme);

// ---------- chats ----------

function saveChats() {
  // Images aren't stored, only their names, so storage doesn't fill up.
  const slim = state.chats.map((c) => ({ ...c, messages: c.messages.map((m) => (m.files ? { ...m, files: m.files.map(({ url, ...f }) => f) } : m)) }));
  store.set('chats', slim);
}

function renderList() {
  const term = $('#search').value.trim().toLowerCase();
  const chats = [...state.chats]
    .sort((a, b) => b.updated - a.updated)
    .filter((c) => !term || c.title.toLowerCase().includes(term) || c.messages.some((m) => m.content.toLowerCase().includes(term)));
  const today = new Date().setHours(0, 0, 0, 0);
  const label = (t) => (t >= today ? 'Today' : t >= today - 864e5 ? 'Yesterday' : t >= today - 7 * 864e5 ? 'Previous 7 days' : 'Older');
  let last = '';
  $('#list').innerHTML = chats.map((c) => {
    const g = label(c.updated);
    const head = g !== last ? `<div class="group">${(last = g)}</div>` : '';
    return `${head}<div class="chat${c === state.chat ? ' on' : ''}" data-id="${c.id}"><span>${esc(c.title)}</span><button data-a="rename" title="Rename">${ICON.edit}</button><button data-a="delete" title="Delete">${ICON.trash}</button></div>`;
  }).join('') || `<div class="group">${term ? 'No matches' : 'No chats yet'}</div>`;
}

$('#search').oninput = renderList;

$('#list').onclick = (e) => {
  const row = e.target.closest('.chat');
  const c = row && state.chats.find((x) => x.id === row.dataset.id);
  if (!c) return;
  const a = e.target.closest('button')?.dataset.a;
  if (a === 'delete') {
    if (!confirm(`Delete "${c.title}"?`)) return;
    state.chats = state.chats.filter((x) => x !== c);
    saveChats();
    if (state.chat === c) newChat(); else renderList();
  } else if (a === 'rename') {
    const input = document.createElement('input');
    input.value = c.title;
    row.replaceChildren(input);
    input.focus();
    input.select();
    const done = (ok) => { if (ok && input.value.trim()) { c.title = input.value.trim(); saveChats(); } renderList(); };
    input.onkeydown = (ev) => { if (ev.key === 'Enter') done(true); if (ev.key === 'Escape') done(false); };
    input.onblur = () => done(true);
  } else {
    openChat(c);
    $('#app').classList.remove('open');
  }
};

function newChat() {
  stop();
  state.chat = null;
  renderThread();
  renderList();
  $('#input').focus();
}

function openChat(c) {
  stop();
  state.chat = c;
  if (c.model) setModel(c.model, false);
  renderThread();
  renderList();
  $('#scroller').scrollTop = 1e9;
}

// ---------- messages ----------

function renderThread() {
  const msgs = state.chat?.messages || [];
  $('#welcome').hidden = msgs.length > 0;
  $('#thread').innerHTML = '';
  msgs.forEach((m, i) => $('#thread').appendChild(msgEl(m, i === msgs.length - 1)));
}

function msgEl(m, isLast) {
  const el = document.createElement('div');
  el.className = 'msg ' + m.role;
  if (m.role === 'user') {
    if (m.files?.length) {
      el.insertAdjacentHTML('beforeend', `<div class="files">${m.files.map((f) => (f.url ? `<img src="${esc(f.url)}" alt="">` : `<span class="chip">📎 ${esc(f.name)}</span>`)).join('')}</div>`);
    }
    if (m.content) el.insertAdjacentHTML('beforeend', `<div class="bubble">${esc(m.content)}</div>`);
  } else {
    if (m.reasoning) el.insertAdjacentHTML('beforeend', `<details class="think"><summary>Thought process</summary><div>${esc(m.reasoning)}</div></details>`);
    el.insertAdjacentHTML('beforeend', `<div class="md">${markdown(m.content)}</div>`);
  }
  const acts = document.createElement('div');
  acts.className = 'actions';
  const btn = (icon, title, fn) => { const b = document.createElement('button'); b.innerHTML = icon; b.title = title; b.onclick = () => fn(b); acts.appendChild(b); };
  btn(ICON.copy, 'Copy', (b) => copy(m.content, b));
  if (m.role === 'assistant' && isLast) btn(ICON.redo, 'Regenerate', () => { if (!state.controller) { state.chat.messages.pop(); send(); } });
  if (m.role === 'assistant' && m.model) acts.insertAdjacentHTML('beforeend', `<span class="tag">${esc(modelName(m.model))}</span>`);
  el.appendChild(acts);
  return el;
}

// Stored messages to what OpenRouter expects. Images are only sent while still in memory.
function toApi(m) {
  if (m.role !== 'user') return { role: m.role, content: m.content };
  let text = m.content;
  const images = [];
  for (const f of m.files || []) {
    if (f.text != null) text += `\n\n<file name="${f.name}">\n${f.text}\n</file>`;
    else if (f.url) images.push({ type: 'image_url', image_url: { url: f.url } });
    else text += `\n\n[image "${f.name}" was attached earlier]`;
  }
  return images.length ? { role: 'user', content: [{ type: 'text', text: text || ' ' }, ...images] } : { role: 'user', content: text };
}

function stop() { state.controller?.abort(); }

async function send() {
  const chat = state.chat;
  const model = state.settings.model;
  if (!model) { openModels(); return; }
  const messages = chat.messages.map(toApi);
  if (state.settings.system) messages.unshift({ role: 'system', content: state.settings.system });

  const reply = { role: 'assistant', content: '', model };
  chat.messages.push(reply);
  renderThread();
  const el = $('#thread').lastElementChild;
  el.innerHTML = '<div class="md cursor"></div>';
  const md = el.firstChild;
  $('#scroller').scrollTop = 1e9;

  state.controller = new AbortController();
  $('#send').hidden = true;
  $('#stop').hidden = false;

  let error = null;
  let painting = false;
  const paint = () => {
    if (painting) return;
    painting = true;
    requestAnimationFrame(() => {
      painting = false;
      md.innerHTML = markdown(reply.content);
      const s = $('#scroller');
      if (s.scrollHeight - s.scrollTop - s.clientHeight < 150) s.scrollTop = 1e9;
    });
  };

  try {
    const body = { model, messages, stream: true };
    if (state.web) body.plugins = [{ id: 'web' }];
    const r = await fetch(API + '/chat/completions', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + state.key, 'Content-Type': 'application/json', 'X-Title': 'Parley' },
      body: JSON.stringify(body),
      signal: state.controller.signal,
    });
    if (!r.ok) {
      let msg = `Request failed (${r.status})`;
      try { msg = (await r.json()).error?.message || msg; } catch {}
      if (r.status === 401) msg = 'OpenRouter rejected the key. The site owner needs to update it.';
      throw new Error(msg);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith('data:') || line === 'data: [DONE]') continue;
        let j;
        try { j = JSON.parse(line.slice(5)); } catch { continue; }
        if (j.error) { error = j.error.message; continue; }
        const d = j.choices?.[0]?.delta || {};
        if (d.reasoning) reply.reasoning = (reply.reasoning || '') + d.reasoning;
        if (d.content) { reply.content += d.content; paint(); }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') error = e.message;
  }

  state.controller = null;
  $('#send').hidden = false;
  $('#stop').hidden = true;
  updateSend();
  if (!reply.content && !reply.reasoning) chat.messages.pop();
  chat.updated = Date.now();
  saveChats();
  if (state.chat === chat) {
    renderThread();
    if (error) $('#thread').insertAdjacentHTML('beforeend', `<div class="errbox">${esc(error)}</div>`);
  }
  renderList();
}

// ---------- composer ----------

const input = $('#input');
function updateSend() { $('#send').disabled = !!state.controller || (!input.value.trim() && !state.files.length); }
function autosize() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
input.oninput = () => { autosize(); updateSend(); };
input.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches) {
    e.preventDefault();
    $('#composer').requestSubmit();
  }
};

$('#composer').onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (state.controller || (!text && !state.files.length)) return;
  if (!state.chat) {
    state.chat = { id: Date.now().toString(36), title: (text || state.files[0].name).slice(0, 60), model: state.settings.model, updated: Date.now(), messages: [] };
    state.chats.push(state.chat);
  }
  state.chat.messages.push({ role: 'user', content: text, ...(state.files.length ? { files: state.files } : {}) });
  state.chat.model = state.settings.model;
  input.value = '';
  state.files = [];
  $('#atts').innerHTML = '';
  autosize();
  send();
};

$('#stop').onclick = stop;
$('#web').onclick = () => { state.web = !state.web; $('#web').setAttribute('aria-pressed', state.web); };

// Attachments: images are shrunk and sent once; text files are included as text.
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = async (e) => {
  for (const f of e.target.files) {
    if (f.type.startsWith('image/')) {
      const bmp = await createImageBitmap(f);
      const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = bmp.width * s;
      c.height = bmp.height * s;
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      state.files.push({ name: f.name, url: c.toDataURL('image/jpeg', 0.82) });
    } else if (f.size < 200e3) {
      state.files.push({ name: f.name, text: await f.text() });
    } else {
      toast(`${f.name} is too big`);
    }
  }
  e.target.value = '';
  $('#atts').innerHTML = state.files.map((f) => (f.url ? `<img src="${esc(f.url)}" alt="">` : `<span class="chip">📎 ${esc(f.name)}</span>`)).join('');
  updateSend();
};

// ---------- models ----------

const isFree = (m) => m.free;
function modelName(id) { return state.models?.find((m) => m.id === id)?.name || id; }

function setModel(id, remember = true) {
  state.settings.model = id;
  if (remember) store.set('settings', state.settings);
  $('#modelname').textContent = modelName(id);
}

async function loadModels() {
  const cached = store.get('models', null);
  if (cached && Date.now() - cached.at < 864e5) state.models = cached.list;
  else {
    try {
      const j = await (await fetch(API + '/models')).json();
      state.models = j.data.map((m) => ({
        id: m.id,
        name: m.name.replace(/^[^:]+:\s*/, ''),
        free: !+m.pricing?.prompt && !+m.pricing?.completion,
      })).sort((a, b) => a.name.localeCompare(b.name));
      store.set('models', { at: Date.now(), list: state.models });
    } catch {
      state.models = [];
    }
  }
  // First visit: start on a free model.
  if (!state.settings.model && state.models.length) setModel((state.models.find(isFree) || state.models[0]).id);
  else if (state.settings.model) setModel(state.settings.model, false);
  if ($('#models').open) renderModels();
}

function openModels() {
  $('#modelsearch').value = '';
  renderModels();
  $('#models').showModal();
  $('#modelsearch').focus();
}

function renderModels() {
  if (!state.models) { $('#modellist').innerHTML = '<p class="muted">Loading…</p>'; return; }
  const words = $('#modelsearch').value.toLowerCase().split(/\s+/).filter(Boolean);
  const list = state.models.filter((m) => words.every((w) => (w === 'free' ? m.free : (m.name + ' ' + m.id).toLowerCase().includes(w))));
  $('#modellist').innerHTML = list.slice(0, 200).map((m, i) =>
    `<button class="mrow${m.id === state.settings.model ? ' on' : ''}${i === 0 ? ' focus' : ''}" data-id="${esc(m.id)}"><span>${esc(m.name)}</span><small>${m.free ? 'Free' : ''}</small></button>`).join('') || '<p class="muted">No models match.</p>';
}

$('#modelbtn').onclick = openModels;
$('#modelsearch').oninput = renderModels;
$('#modelsearch').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#modellist .mrow')?.click(); } };
$('#modellist').onclick = (e) => {
  const row = e.target.closest('.mrow');
  if (!row) return;
  setModel(row.dataset.id);
  $('#models').close();
};

// ---------- settings ----------

$('#settingsbtn').onclick = () => {
  $('#system').value = state.settings.system || '';
  $('#theme').value = state.settings.theme || 'system';
  $('#settings').showModal();
};
$('#savesettings').onclick = () => {
  state.settings.system = $('#system').value.trim();
  state.settings.theme = $('#theme').value;
  store.set('settings', state.settings);
  applyTheme();
  $('#settings').close();
  toast('Saved');
};
$('#logout').onclick = () => {
  if (!confirm('Log out of this browser? Your chats stay saved here.')) return;
  store.del('key');
  store.del('lock');
  location.reload();
};

$$('[data-close]').forEach((b) => (b.onclick = () => b.closest('dialog').close()));
$$('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));

// ---------- sidebar ----------

$('#toggleside').onclick = () => $('#app').classList.toggle(innerWidth <= 800 ? 'open' : 'noside');
$('#scrim').onclick = () => $('#app').classList.remove('open');
$('#newchat').onclick = () => { $('#app').classList.remove('open'); newChat(); };
$('#newchat2').onclick = newChat;

// ---------- start ----------

function startApp() {
  $('#gate').hidden = true;
  $('#app').hidden = false;
  renderList();
  renderThread();
  loadModels();
  input.focus();
}

applyTheme();
if (state.key && (!LOCKED || store.get('lock', '') === LOCKED)) startApp();
else showGate();
</script>
</body>
